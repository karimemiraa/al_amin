name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of interrupting a
# running `docker compose up --build` on the server.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Secrets cannot be used in a job-level `if`, so they are exposed as job
    # env and checked per step. Without secrets (e.g. in a fork or before the
    # server exists) the job succeeds and only prints a notice.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Deployment not configured
        if: env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_KEY == ''
        run: echo "::notice::Skipping deployment - set VPS_HOST, VPS_USER and VPS_SSH_KEY in the repository secrets (see docs/DEPLOYMENT.md)."

      - name: Deploy via SSH
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Optional: SHA256 host key fingerprint to protect against MITM.
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/igh-website
            git fetch origin main
            git reset --hard origin/main
            docker compose -f deploy/docker-compose.yml up -d --build
            docker image prune -f
            docker builder prune -f --filter "until=168h"
