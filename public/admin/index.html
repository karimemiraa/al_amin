<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Inhalte bearbeiten – IGH Hannover</title>
    <!--
      The page is served at /admin (no trailing slash, trailingSlash: 'never'),
      so a relative "config.yml" would resolve to /config.yml. Point to it explicitly.
    -->
    <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Sveltia CMS, pinned to an exact version with Subresource Integrity.
      To update: change the version, then recompute the hash:
        curl -sL https://unpkg.com/@sveltia/cms@VERSION/dist/sveltia-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.235.1/dist/sveltia-cms.js"
      integrity="sha384-0buNFRS4cnwrZfClZMgBYxOTaefGGJltRCRnsKTgLl+q0sOGWcd8sgJpgwr1oKUl"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
