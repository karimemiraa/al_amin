# Sveltia CMS configuration (Decap/Netlify-CMS compatible)
# Docs: https://sveltiacms.app/en/docs
#
# The CMS runs entirely in the browser at https://www.igh-hannover.de/admin and
# commits changes directly to the GitHub repository. Every commit to `main`
# triggers .github/workflows/deploy.yml, so changes are live after ~2-3 minutes.
#
# Sign-in: with a GitHub personal access token (fine-grained, "Contents: read
# and write" on this repository). No OAuth server is needed. See
# docs/CMS-ANLEITUNG.md.
#
# The UI language follows the browser / the user's Sveltia settings (German is
# available); Sveltia has no config option to force it.
#
# Field names must match the zod schemas in src/content.config.ts and the keys
# of the JSON files in src/content/settings/. Change both together.

backend:
  name: github
  # NOTE: the repository may move to the association's GitHub organisation.
  # Update this value (and the server's git remote) when it does.
  repo: karimemiraa/al_amin
  branch: main
  # Token sign-in only: there is no OAuth server for the "Sign in with GitHub" button.
  auth_methods: [token]
  commit_messages:
    create: "CMS: {{collection}} „{{slug}}“ erstellt"
    update: "CMS: {{collection}} „{{slug}}“ geändert"
    delete: "CMS: {{collection}} „{{slug}}“ gelöscht"
    uploadMedia: "CMS: Datei {{path}} hochgeladen"
    deleteMedia: "CMS: Datei {{path}} gelöscht"

app_title: IGH Hannover – Inhalte
site_url: https://www.igh-hannover.de

# Uploaded images land in public/uploads and are served as /uploads/<datei>.
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  json:
    indent_style: space
    indent_size: 2

collections:
  # ---------------------------------------------------------------------------
  # Einstellungen (single JSON files)
  # ---------------------------------------------------------------------------
  - name: settings
    label: Einstellungen
    label_singular: Einstellung
    description: Spendenstand, Gebetszeiten-Einstellungen und allgemeine Angaben zur Moschee.
    icon: settings
    format: json
    editor:
      preview: false
    files:
      # ----- campaign.json -----
      - name: campaign
        label: Spendenkampagne (Moscheekauf)
        icon: volunteer_activism
        file: src/content/settings/campaign.json
        fields:
          - label: Aktueller Spendenstand (€)
            name: raised
            widget: number
            value_type: int
            min: 0
            hint: "Aktueller Spendenstand in Euro (nur Ziffern, ohne Punkte). Bitte zusammen mit 'Stand (Datum)' mindestens wöchentlich aktualisieren."
          - label: Stand (Datum)
            name: asOf
            widget: datetime
            type: date
            format: YYYY-MM-DD
            time_format: false
            hint: Datum, an dem der Spendenstand zuletzt geprüft wurde. Wird zusammen mit dem Spendenstand angezeigt.
          - label: Anzahl Spender
            name: donors
            widget: number
            value_type: int
            min: 0
            hint: Anzahl der bisherigen Spenderinnen und Spender. 0 lassen, wenn unbekannt.
          - label: Spendenziel (€)
            name: goal
            widget: number
            value_type: int
            min: 0
            hint: Gesamtbetrag in Euro, der gesammelt werden soll (z. B. 1300000 für 1,3 Mio. €).
          - label: Spendenfrist
            name: deadline
            widget: datetime
            type: date
            format: YYYY-MM-DD
            time_format: false
            hint: Bis zu diesem Datum muss das Geld zusammenkommen.
          - label: Preis pro m² (€)
            name: pricePerSqm
            widget: number
            value_type: int
            min: 0
            hint: Kaufpreis pro Quadratmeter (Grundlage für „m² spenden“).
          - label: Gesamtfläche (m²)
            name: totalSqm
            widget: number
            value_type: int
            min: 0
          - label: Anzahl Etagen
            name: floors
            widget: number
            value_type: int
            min: 0
          - label: Fläche pro Etage (m²)
            name: sqmPerFloor
            widget: number
            value_type: int
            min: 0
          - label: Außengelände (m²)
            name: outdoorSqm
            widget: number
            value_type: int
            min: 0
          - label: Entfernung zur jetzigen Moschee (km)
            name: distanceToCurrentKm
            widget: number
            value_type: float
            min: 0
            step: 0.1
            hint: Kommazahlen mit Punkt eingeben, z. B. 1.5
          - label: Gehminuten zur nächsten Haltestelle
            name: minutesToTransit
            widget: number
            value_type: int
            min: 0
          - label: Meilensteine
            name: milestones
            label_singular: Meilenstein
            widget: list
            summary: "{{fields.date}} – {{fields.titleDe}}"
            collapsed: true
            hint: Zeitleiste auf der Spendenseite, in zeitlicher Reihenfolge. Erledigte Schritte mit „Erledigt“ markieren.
            fields:
              - label: Zeitpunkt
                name: date
                widget: string
                pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', "Format: 2027 oder 2027-02 oder 2027-02-01"]
                hint: "Jahr (2027), Monat (2027-02) oder genauer Tag (2027-02-01)."
              - label: Erledigt
                name: done
                widget: boolean
                default: false
              - label: Titel
                name: titleDe
                widget: string
              - label: Titel (Arabisch)
                name: titleAr
                widget: string
                required: false
                hint: Optional. Leer = deutscher Text wird angezeigt.

      # ----- prayer.json -----
      - name: prayer
        label: Gebetszeiten & Freitagsgebet
        icon: schedule
        file: src/content/settings/prayer.json
        fields:
          - label: Iqama (Minuten nach dem Adhan)
            name: iqamaOffsets
            widget: object
            hint: Wie viele Minuten nach Gebetsbeginn (Adhan) das Gemeinschaftsgebet (Iqama) beginnt. Die Gebetszeiten selbst kommen aus der Jahrestabelle.
            fields:
              - { label: Fadschr, name: fajr, widget: number, value_type: int, min: 0, max: 120 }
              - { label: Dhuhr, name: dhuhr, widget: number, value_type: int, min: 0, max: 120 }
              - { label: Asr, name: asr, widget: number, value_type: int, min: 0, max: 120 }
              - { label: Maghrib, name: maghrib, widget: number, value_type: int, min: 0, max: 120 }
              - { label: Ischa, name: isha, widget: number, value_type: int, min: 0, max: 120 }
          - label: Freitagsgebet (Dschumua)
            name: jumuah
            label_singular: Freitagsgebet
            widget: list
            min: 1
            summary: "{{fields.time}} Uhr"
            hint: Ein Eintrag pro Freitagsgebet. Gibt es zwei Freitagsgebete, einfach einen zweiten Eintrag hinzufügen.
            fields:
              - label: Uhrzeit
                name: time
                widget: string
                pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Format: HH:MM, z. B. 14:00"]
                hint: "Beginn im Format HH:MM, z. B. 14:00 (Winter) oder 13:30."
              - label: Hinweis
                name: noteDe
                widget: string
                required: false
                hint: z. B. „Predigt auf Arabisch, simultan ins Deutsche übersetzt“
              - label: Hinweis (Arabisch)
                name: noteAr
                widget: string
                required: false
          - label: Aktueller Hinweis
            name: noticeDe
            widget: text
            required: false
            hint: Erscheint bei den Gebetszeiten, z. B. „Im Ramadan Tarawih um 21:30 Uhr“. Leer lassen, wenn es keinen Hinweis gibt.
          - label: Aktueller Hinweis (Arabisch)
            name: noticeAr
            widget: text
            required: false

      # ----- site.json -----
      - name: site
        label: Moschee & Verein (Kontakt, Impressum, Bank)
        icon: mosque
        file: src/content/settings/site.json
        fields:
          - label: Name des Vereins
            name: orgName
            widget: string
            hint: Offizieller Name laut Vereinsregister (erscheint im Impressum und auf Spendenquittungen).
          - label: Name der Moschee
            name: mosqueName
            widget: string
          - label: Name der Moschee (Arabisch)
            name: mosqueNameAr
            widget: string
          - label: Straße und Hausnummer
            name: street
            widget: string
          - label: PLZ
            name: zip
            widget: string
            pattern: ['^\d{5}$', "Bitte 5-stellige Postleitzahl eingeben"]
          - label: Ort
            name: city
            widget: string
          - label: Anfahrt
            name: directionsDe
            widget: text
            hint: Kurze Wegbeschreibung (Eingang, Haltestellen, Parken).
          - label: Anfahrt (Arabisch)
            name: directionsAr
            widget: text
            required: false
          - label: Telefon
            name: phone
            widget: string
            hint: Internationales Format, z. B. +49 173 1234567
          - label: Ansprechpartner Telefon
            name: phoneContactName
            widget: string
            required: false
          - label: E-Mail
            name: email
            widget: string
            type: email
          - label: Google-Maps-Link
            name: mapsUrl
            widget: string
            type: url
          - label: Gründungsjahr
            name: founded
            widget: number
            value_type: int
            min: 1900
            max: 2100
          - label: Vertretungsberechtigter Vorstand
            name: representatives
            label_singular: Person
            widget: list
            field: { label: Name, name: name, widget: string }
            hint: Personen, die den Verein nach § 26 BGB vertreten (Pflichtangabe im Impressum).
          - label: Registergericht
            name: registerCourt
            widget: string
            hint: z. B. Amtsgericht Hannover
          - label: Vereinsregisternummer
            name: registerNumber
            widget: string
            required: false
            hint: z. B. VR 123456 (steht auf dem Registerauszug).
          - label: Finanzamt
            name: taxOffice
            widget: string
            required: false
            hint: z. B. Finanzamt Hannover-Nord
          - label: Steuernummer
            name: taxNumber
            widget: string
            required: false
          - label: Datum des Freistellungsbescheids
            name: exemptionNoticeDate
            widget: datetime
            type: date
            format: YYYY-MM-DD
            time_format: false
            required: false
            hint: Datum des letzten Freistellungsbescheids / Feststellungsbescheids des Finanzamts (Gemeinnützigkeit). Wird für Zuwendungsbestätigungen benötigt.
          - label: Bankverbindung für Spenden
            name: bank
            widget: object
            hint: Wird auf der Spendenseite und im GiroCode (QR-Code für Banking-Apps) verwendet. Bitte sehr sorgfältig prüfen!
            fields:
              - label: Kontoinhaber
                name: accountHolder
                widget: string
              - label: IBAN
                name: iban
                widget: string
                pattern: ['^DE\d{2}( ?\d{4}){4} ?\d{2}$', "Bitte eine deutsche IBAN eingeben, z. B. DE43 2505 0000 0152 0613 70"]
                hint: Mit Leerzeichen in Viererblöcken, z. B. DE43 2505 0000 0152 0613 70
              - label: BIC
                name: bic
                widget: string
              - label: Bank
                name: bankName
                widget: string
              - label: Verwendungszweck
                name: reference
                widget: string
                hint: Vorgeschlagener Verwendungszweck, z. B. „Spende Moscheekauf“.
          - label: Soziale Medien
            name: social
            widget: object
            hint: Leer lassen, was es (noch) nicht gibt – leere Felder werden auf der Website nicht angezeigt.
            fields:
              - label: Telegram-Link
                name: telegram
                widget: string
                required: false
                hint: z. B. https://t.me/Masjid_Mohammad_Al_Amien
              - label: YouTube-Kanal-ID
                name: youtubeChannelId
                widget: string
                required: false
                hint: Beginnt mit „UC…“ (YouTube Studio → Einstellungen → Kanal → Erweiterte Einstellungen).
              - label: YouTube-Link
                name: youtubeUrl
                widget: string
                required: false
                hint: z. B. https://www.youtube.com/@kanalname
              - label: WhatsApp-Kanal-Link
                name: whatsappChannel
                widget: string
                required: false
              - label: Instagram-Link
                name: instagram
                widget: string
                required: false

  # ---------------------------------------------------------------------------
  # Aktuelles (one JSON file per announcement)
  # ---------------------------------------------------------------------------
  - name: announcements
    label: Aktuelles
    label_singular: Meldung
    description: Neuigkeiten, Veranstaltungen und Hinweise für die Startseite und die Seite „Aktuelles“.
    icon: campaign
    folder: src/content/announcements
    format: json
    extension: json
    create: true
    identifier_field: title_de
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    slug_length: 80
    summary: "{{date | date('DD.MM.YYYY')}} – {{title_de}}"
    sortable_fields:
      fields: [date, title_de, category]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Angeheftet, field: pinned, pattern: true }
      - { label: Ausgeblendet / Entwürfe, field: published, pattern: false }
    fields:
      - label: Titel
        name: title_de
        widget: string
      - label: Titel (Arabisch)
        name: title_ar
        widget: string
        required: false
        hint: Optional. Leer = deutscher Titel wird auf der arabischen Seite angezeigt.
      - label: Datum
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
        hint: Veröffentlichungsdatum. Neueste Meldungen stehen oben.
      - label: Kategorie
        name: category
        widget: select
        default: news
        options:
          - { label: Neuigkeit, value: news }
          - { label: Spendenkampagne, value: campaign }
          - { label: Veranstaltung, value: event }
          - { label: Ramadan, value: ramadan }
      - label: Termin (bei Veranstaltungen)
        name: eventDate
        widget: string
        required: false
        hint: Nur bei Veranstaltungen, z. B. „Samstag, 25.10.2026, nach Maghrib“.
      - label: Text
        name: text_de
        widget: markdown
        modes: [rich_text, raw]
        hint: Kurz und klar. Fett, Listen und Links sind möglich.
      - label: Text (Arabisch)
        name: text_ar
        widget: markdown
        modes: [rich_text, raw]
        required: false
        hint: Optional. Leer = deutscher Text wird auf der arabischen Seite angezeigt.
      - label: Bild
        name: image
        widget: image
        required: false
        hint: Optional. Querformat (z. B. 1600 × 900 px), JPG oder WebP, möglichst unter 500 KB. Keine Fotos von Personen ohne deren Einverständnis.
      - label: Oben anheften
        name: pinned
        widget: boolean
        default: false
        hint: Angeheftete Meldungen stehen immer ganz oben. Nur für wirklich wichtige Meldungen nutzen.
      - label: Veröffentlicht
        name: published
        widget: boolean
        default: true
        hint: Ausschalten, um die Meldung auf der Website auszublenden (z. B. als Entwurf oder nach Ablauf).

  # ---------------------------------------------------------------------------
  # Programm (weekly lessons)
  # ---------------------------------------------------------------------------
  - name: program
    label: Programm (Unterricht)
    label_singular: Unterricht
    description: Wöchentliche Unterrichte und Kreise. Die Uhrzeit ergibt sich meist aus dem Gebet, nach dem der Unterricht beginnt.
    icon: menu_book
    folder: src/content/program
    format: json
    extension: json
    create: true
    identifier_field: title_de
    slug: "{{slug}}"
    slug_length: 60
    summary: "{{title_de}}"
    sortable_fields:
      fields: [weekday, title_de]
      default: { field: weekday, direction: ascending }
    view_filters:
      - { label: Inaktiv, field: active, pattern: false }
    fields:
      - label: Titel
        name: title_de
        widget: string
      - label: Titel (Arabisch)
        name: title_ar
        widget: string
        hint: Pflichtfeld – im Zweifel den deutschen Titel kopieren.
      - label: Wochentag
        name: weekday
        widget: select
        options:
          - { label: Sonntag, value: 0 }
          - { label: Montag, value: 1 }
          - { label: Dienstag, value: 2 }
          - { label: Mittwoch, value: 3 }
          - { label: Donnerstag, value: 4 }
          - { label: Freitag, value: 5 }
          - { label: Samstag, value: 6 }
      - label: Beginn
        name: after
        widget: select
        options:
          - { label: nach Fadschr, value: fajr }
          - { label: nach Dhuhr, value: dhuhr }
          - { label: nach Asr, value: asr }
          - { label: nach Maghrib, value: maghrib }
          - { label: nach Ischa, value: isha }
          - { label: feste Uhrzeit, value: time }
      - label: Uhrzeit
        name: time
        widget: string
        required: false
        pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Format: HH:MM, z. B. 18:30"]
        hint: Nur ausfüllen, wenn bei „Beginn“ „feste Uhrzeit“ gewählt ist. Format HH:MM.
      - label: Beschreibung
        name: desc_de
        widget: text
        required: false
      - label: Beschreibung (Arabisch)
        name: desc_ar
        widget: text
        required: false
      - label: Sprache
        name: language
        widget: select
        options:
          - { label: Deutsch, value: de }
          - { label: Arabisch, value: ar }
          - { label: Deutsch & Arabisch, value: de-ar }
      - label: Zielgruppe
        name: audience
        widget: select
        default: all
        options:
          - { label: Alle, value: all }
          - { label: Männer, value: men }
          - { label: Frauen, value: women }
          - { label: Kinder, value: kids }
          - { label: Jugendliche, value: youth }
      - label: Lehrer / Referent
        name: teacher
        widget: string
        required: false
      - label: Aktiv
        name: active
        widget: boolean
        default: true
        hint: Ausschalten, wenn der Unterricht pausiert (z. B. in den Ferien). Der Eintrag bleibt erhalten.

  # ---------------------------------------------------------------------------
  # Mediathek (YouTube videos)
  # ---------------------------------------------------------------------------
  - name: videos
    label: Mediathek (Videos)
    label_singular: Video
    description: YouTube-Videos (Freitagspredigten, Vorträge) für die Mediathek.
    icon: smart_display
    folder: src/content/videos
    format: json
    extension: json
    create: true
    identifier_field: title_de
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    slug_length: 80
    summary: "{{date | date('DD.MM.YYYY')}} – {{title_de}}"
    sortable_fields:
      fields: [date, title_de, series]
      default: { field: date, direction: descending }
    fields:
      - label: YouTube-Video-ID
        name: youtubeId
        widget: string
        pattern: ['^[A-Za-z0-9_-]{11}$', "Bitte nur die 11-stellige Video-ID eingeben, z. B. JYlszuOud10"]
        hint: "Die 11 Zeichen nach „watch?v=“ bzw. nach „youtu.be/“. Beispiel: https://www.youtube.com/watch?v=**JYlszuOud10** → JYlszuOud10"
      - label: Titel
        name: title_de
        widget: string
      - label: Titel (Arabisch)
        name: title_ar
        widget: string
        required: false
        hint: Optional. Am besten den Original-Titel von YouTube übernehmen.
      - label: Datum
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
        hint: Datum der Predigt bzw. des Vortrags.
      - label: Reihe
        name: series
        widget: select
        default: other
        options:
          - { label: Freitagspredigt (Khutba), value: khutbah }
          - { label: Sira (Prophetenbiografie), value: sirah }
          - { label: Aqida (Glaubenslehre), value: aqidah }
          - { label: Tazkiya (Läuterung des Herzens), value: tazkiyah }
          - { label: Koran, value: quran }
          - { label: Spendenkampagne, value: campaign }
          - { label: Sonstiges, value: other }
      - label: Sprache
        name: language
        widget: select
        options:
          - { label: Deutsch, value: de }
          - { label: Arabisch, value: ar }
          - { label: Deutsch & Arabisch, value: de-ar }
      - label: Sprecher
        name: speaker
        widget: string
        required: false
        hint: z. B. Sheikh Ahmad Obaid
      - label: Hervorheben
        name: featured
        widget: boolean
        default: false
        hint: Wird groß oben in der Mediathek gezeigt. Am besten nur beim neuesten Video einschalten (und beim vorherigen ausschalten).
