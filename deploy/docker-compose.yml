# Production stack: Astro/Node app behind Caddy (automatic HTTPS).
#
# Run from the repository root (/opt/igh-website):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Paths below are relative to this file (deploy/), so ../.env is the .env in
# the repository root.

name: igh-website

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      # PUBLIC_* variables are baked into the static pages at build time.
      # The Dockerfile reads only the PUBLIC_* lines from this secret; other
      # values (Stripe key, SMTP password) never end up in the image.
      secrets:
        - dotenv
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
    restart: unless-stopped
    # Only reachable from Caddy inside the Docker network, not from the internet.
    expose:
      - "4321"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates - keep this volume!
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  dotenv:
    file: ../.env

volumes:
  caddy_data:
  caddy_config:
